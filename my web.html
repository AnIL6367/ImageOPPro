<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageOP Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

.header{
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
}

button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:#4a7cff;
    color:white;
    cursor:pointer;
}

.container{
    text-align:center;
    padding:40px 15px;
}

.upload-box{
    width:90%;
    max-width:400px;
    margin:auto;
    padding:40px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    cursor:pointer;
}

.tools button{
    margin:5px;
}

canvas{
    margin-top:20px;
    width:90%;
    max-width:500px;
}

.page{ display:none; }

.card{
    width:260px;
    margin:10px auto;
    padding:12px;
    border-radius:10px;
    font-size:14px;
}

.green{ background:#00c853; }
.red{ background:#d50000; }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div>ImageOP Pro</div>
    <button onclick="openAdmin()">Admin 👤</button>
</div>

<!-- MAIN -->
<div class="container" id="mainPage">

<input type="file" id="fileInput" hidden>

<div class="upload-box" onclick="fileInput.click()">
📁 Upload File
</div>

<div class="tools">
<button onclick="imageToPDF()">Image → PDF</button>
<button onclick="pdfToImage()">PDF → Image</button>
<button onclick="compressImage()">Compress</button>
</div>

<canvas id="canvas"></canvas>

</div>

<!-- USER LOGIN -->
<div class="container page" id="userLogin">
<h2>User Login</h2>
<input id="userEmail" placeholder="Email"><br><br>
<button onclick="loginUser()">Continue</button>
</div>

<!-- ADMIN LOGIN -->
<div class="container page" id="adminLogin">
<h2>Admin Login</h2>
<input id="adminEmail" placeholder="Email"><br><br>
<button onclick="checkAdmin()">Next</button>
</div>

<!-- ADMIN KEY -->
<div class="container page" id="adminKeyPage">
<h2>Security Key</h2>
<input id="adminKey" placeholder="Key"><br><br>
<button onclick="openDashboard()">Open</button>
</div>

<!-- ADMIN PANEL -->
<div class="container page" id="adminPanel">

<h2>Admin Dashboard</h2>

<div id="stats"></div>
<div id="usersDiv"></div>
<div id="suggestionsDiv"></div>

</div>

<script>

let file = null;
fileInput.onchange = e => file = e.target.files[0];

const stats = document.getElementById("stats");
const usersDiv = document.getElementById("usersDiv");
const suggestionsDiv = document.getElementById("suggestionsDiv");

/* USER LOGIN */
function loginUser(){

    let email = userEmail.value || "Guest";

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    users.push({
        email,
        time: new Date().toLocaleString(),
        device: /Mobi/i.test(navigator.userAgent) ? "Mobile" : "Desktop"
    });

    localStorage.setItem("users", JSON.stringify(users));

    userLogin.style.display="none";
    mainPage.style.display="block";
}

/* ADMIN OPEN */
function openAdmin(){
    mainPage.style.display="none";
    adminLogin.style.display="block";
}

function checkAdmin(){
    if(adminEmail.value === "anilmarval5@gmail.com"){
        adminLogin.style.display="none";
        adminKeyPage.style.display="block";
    } else alert("Wrong Email");
}

function openDashboard(){
    if(adminKey.value === "kumawat6367ak"){
        localStorage.setItem("adminLogged","true");

        adminKeyPage.style.display="none";
        adminPanel.style.display="block";
        loadAdmin();
    } else alert("Wrong Key");
}

/* ADMIN LOAD */
function loadAdmin(){

    let users = JSON.parse(localStorage.getItem("users") || "[]");
    let sug = JSON.parse(localStorage.getItem("s") || "[]");

    let mobile = users.filter(u => u.device === "Mobile").length;
    let desktop = users.length - mobile;

    stats.innerHTML = `
        <div class="card green">Total Users: ${users.length}</div>
        <div class="card red">Mobile: ${mobile}</div>
        <div class="card green">Desktop: ${desktop}</div>
    `;

    usersDiv.innerHTML = "";
    suggestionsDiv.innerHTML = "";

    users.forEach(u => {
        usersDiv.innerHTML += `
        <div class="card red">
            ${u.email}<br>${u.device}<br>${u.time}
        </div>`;
    });

    sug.forEach(s => {
        suggestionsDiv.innerHTML += `
        <div class="card green">
            ${s.name}<br>${s.msg}<br>${s.time}
        </div>`;
    });
}

/* AUTO ADMIN SESSION */
window.onload = function(){
    if(localStorage.getItem("adminLogged") === "true"){
        mainPage.style.display="none";
        adminPanel.style.display="block";
        loadAdmin();
    }
}

/* IMAGE → PDF */
function imageToPDF(){
    if(!file) return alert("Upload file first");

    const { jsPDF } = window.jspdf;
    let pdf = new jsPDF();

    let img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = () => {
        pdf.addImage(img,'JPEG',10,10,180,160);
        pdf.save("file.pdf");
    }
}

/* PDF → IMAGE */
function pdfToImage(){
    if(!file) return alert("Upload PDF first");

    let reader = new FileReader();

    reader.onload = function(){
        let typed = new Uint8Array(this.result);

        pdfjsLib.getDocument(typed).promise.then(pdf=>{
            pdf.getPage(1).then(page=>{
                let v = page.getViewport({scale:1.5});
                let ctx = canvas.getContext("2d");

                canvas.width=v.width;
                canvas.height=v.height;

                page.render({canvasContext:ctx,viewport:v});
            });
        });
    }

    reader.readAsArrayBuffer(file);
}

/* COMPRESS */
function compressImage(){
    if(!file) return alert("Upload image first");

    let img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload=()=>{
        let ctx = canvas.getContext("2d");

        canvas.width = img.width/2;
        canvas.height = img.height/2;

        ctx.drawImage(img,0,0,canvas.width,canvas.height);
    }
}

</script>

</body>
</html>
