text-align:center;
}

/* TITLE */

font-size:50px;

}

/* CONTENT */

.section{

}

/* LAYOUT */

.container{

justify-content:space-between;
align-items:center;

/* GODZILLA IMAGE */

.godzilla img{

/* CLOCK */

.clock{

height:220px;
border:6px solid white;
border-radius:50%;
position:relative;
}

.hand{
position:absolute;
background:white;
top:50%;
left:50%;
transform-origin:left;
}

.hour{width:60px;height:4px;}
.minute{width:80px;height:3px;}
.second{width:100px;height:2px;background:red;}

.text{
position:absolute;
font-size:11px;
width:80px;
text-align:center;
}

.t12{top:5px;left:70px;}
.t3{right:-10px;top:100px;}
.t6{bottom:5px;left:70px;}
.t9{left:-10px;top:100px;}

</style>
</head>

<body>

<div class="title">

<!-- GODZILLA + CLOCK -->

<div class="hand hour"></div>

<div class="hand second"></div>

<div class="text t12">YOUR TIME IS AND </div>

</div>

<script>

function show(id){

document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}

/* CLOCK */

function updateClock(){

const now = new Date();

const sec = now.getSeconds()*6;
const min = now.getMinutes()*6;
const hr = now.getHours()*30 + min/12;

document.querySelector(".second").style.transform=`rotate(${sec}deg)`;
document.querySelector(".minute").style.transform=`rotate(${min}deg)`;
document.querySelector(".hour").style.transform=`rotate(${hr}deg)`;

}

setInterval(updateClock,1000);

</script>
